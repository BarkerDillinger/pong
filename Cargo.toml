[package]
name = "pong"
version = "0.1.0"
edition = "2024"
description = "A modern network reachability and discovery utility"
license = "MIT"

[[bin]]
name = "pong"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
console = "0.16.6"
ctrlc = "3.5.2"
libc = "0.2.189"
serde = { version = "1", features = ["derive"] }
serde_json = "1"